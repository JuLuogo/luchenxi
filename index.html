<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>课堂积分实时榜</title>
<link rel="icon" href="data:,">
<style>
:root{--bg1:#101a2b;--bg2:#1c2c48;--card:rgba(255,255,255,.06);--line:rgba(255,255,255,.12)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:'Segoe UI',Tahoma,Verdana,'Microsoft YaHei',sans-serif;color:#eef2f7;
  background:radial-gradient(1200px 600px at 15% 0%,#22355c 0%,var(--bg1) 55%),linear-gradient(160deg,var(--bg1),var(--bg2));
  padding:18px}
.wrap{max-width:1500px;margin:0 auto}
.head{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:14px}
.title{font-size:2rem;font-weight:800;letter-spacing:2px;margin:0;
  background:linear-gradient(90deg,#ffffff,#9fd0ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.pill{padding:5px 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:.9rem}
.pill.ok{border-color:rgba(102,187,106,.6);color:#b9f6ca}
.pill.warn{border-color:rgba(255,183,77,.6);color:#ffe0b2}
.pill.bad{border-color:rgba(239,83,80,.6);color:#ffcdd2}
.grid{display:grid;grid-template-columns:1.15fr .85fr;gap:16px}
@media (max-width:1024px){.grid{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;backdrop-filter:blur(6px)}
.card h2{margin:0 0 12px;font-size:1.15rem;letter-spacing:1px;opacity:.9;display:flex;gap:10px;align-items:center}
.team{border-radius:14px;padding:14px 16px;margin-bottom:12px;background:rgba(255,255,255,.05);
  border-left:8px solid #66bb6a;display:grid;grid-template-columns:64px 1fr auto;align-items:center;gap:14px;transition:.3s}
.team.top1{border-left-color:#ffd54f;box-shadow:0 0 0 1px rgba(255,213,79,.35),0 10px 30px rgba(255,213,79,.12)}
.team.top2{border-left-color:#cfd8dc}
.team.top3{border-left-color:#ffb74d}
.rank{font-size:1.6rem;font-weight:800;text-align:center;opacity:.95}
.tname{font-size:1.7rem;font-weight:800;letter-spacing:1px}
.tsub{font-size:.88rem;opacity:.7;margin-top:4px}
.tscore{font-size:2.6rem;font-weight:900;text-align:right;font-variant-numeric:tabular-nums}
.bar{height:8px;border-radius:999px;background:rgba(255,255,255,.12);overflow:hidden;margin-top:8px}
.bar > i{display:block;height:100%;border-radius:999px;background:currentColor}
ol.stu{list-style:none;margin:0;padding:0;max-height:62vh;overflow:auto}
ol.stu li{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;padding:9px 12px;margin-bottom:8px;
  background:rgba(255,255,255,.05);border-radius:12px;border-left:5px solid #66bb6a}
ol.stu li.top1{border-left-color:#ffd54f}ol.stu li.top2{border-left-color:#cfd8dc}ol.stu li.top3{border-left-color:#ffb74d}
ol.stu li.empty{display:block;background:transparent;border-left:none;text-align:center}
.sname{font-size:1.25rem;font-weight:700}
.ssub{font-size:.8rem;opacity:.65}
.sscore{font-size:1.5rem;font-weight:800;font-variant-numeric:tabular-nums}
.qbox{margin-top:16px}
.qstem{font-size:1.35rem;font-weight:700;line-height:1.5;margin:6px 0}
.qtags{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.qtag{padding:3px 10px;border-radius:999px;font-size:.82rem;background:rgba(255,255,255,.1);border:1px solid var(--line)}
.qtag-live{border-color:rgba(102,187,106,.8);color:#b9f6ca}
.qtag-ans{border-color:rgba(255,213,79,.8);color:#ffe082}
.qopts{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px;margin-top:12px}
.opt{display:flex;gap:10px;align-items:center;padding:12px 14px;border-radius:12px;background:rgba(255,255,255,.06);
  border:1px solid var(--line);font-size:1.15rem}
.opt b{width:28px;height:28px;flex:0 0 28px;border-radius:50%;background:rgba(255,255,255,.14);
  display:flex;align-items:center;justify-content:center;font-size:.95rem}
.opt-ans{border-color:rgba(102,187,106,.85);background:rgba(102,187,106,.16)}
.tick-buzz{border-color:rgba(255,183,77,.6)}
.ticker{margin-top:16px;display:flex;gap:10px;flex-wrap:wrap}
.tick{padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid var(--line);font-size:.9rem;
  animation:fadein .4s ease}
.tick b{font-variant-numeric:tabular-nums}
@keyframes fadein{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.empty{opacity:.7;text-align:center;padding:26px;font-style:italic}
.foot{margin-top:14px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:.85rem;opacity:.65}
.icp a{color:inherit;text-decoration:none}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <h1 class="title" id="courseTitle">课堂积分实时榜</h1>
    <span class="pill" id="status">等待数据…</span>
    <span class="pill" id="quizPill" style="display:none"></span>
    <span style="flex:1"></span>
    <button class="pill" style="cursor:pointer" onclick="requestNow()">重新请求</button>
  </div>

  <div class="grid">
    <div class="card">
      <h2>🏆 队伍榜 <span class="pill" id="tierHint"></span></h2>
      <div id="teamList"><div class="empty">等待数据…</div></div>
    </div>

    <div class="card">
      <h2>⭐ 个人榜</h2>
      <ol class="stu" id="stuList"><li class="empty">等待数据…</li></ol>
    </div>
  </div>

  <div class="card qbox" id="questionCard" style="display:none">
    <h2>📌 当前题目</h2>
    <div class="qstem" id="qStem"></div>
    <div class="qtags" id="qTags"></div>
    <div class="qopts" id="qOptions" style="display:none"></div>
  </div>

  <div class="card qbox" id="buzzCard" style="display:none">
    <h2>⚡ 抢答榜</h2>
    <div class="ticker" id="buzzList"></div>
  </div>

  <div class="ticker" id="ticker"></div>

  <div class="foot">
    <span id="footer">尚未同步</span>
    <span class="icp"><a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener noreferrer">冀ICP备2025122485号-1</a></span>
  </div>
</div>

<script>
/* 大屏页（枢纽角色 = stage）：只消费教师端推送的课堂快照，不修改任何数据。
   地址：/stage 或 index.html?room=xxx&ws=192.168.1.100:8080 */
var QS = (function () { try { return new URLSearchParams(location.search); } catch (e) { return { get: function () { return null; } }; } })();
var ROOM = QS.get('room') || (function () { try { return localStorage.getItem('ci_room') || 'default'; } catch (e) { return 'default'; } })();
var WS_HOST = (function () {
  try {
    if (QS.get('ws')) return QS.get('ws');
    if (location.protocol === 'http:' || location.protocol === 'https:') return location.host;  // 默认与页面同源（教师机枢纽）
    var ls = localStorage.getItem('ci_ws_host');
    if (ls) return ls;
  } catch (e) {}
  return 'ws.peroe.top';
})();
var WS_URL = (/^wss?:\/\//i.test(WS_HOST) ? WS_HOST : ((location.protocol === 'https:' ? 'wss://' : 'ws://') + WS_HOST)) +
  '/?room=' + encodeURIComponent(ROOM) + '&role=stage';

var ws = null, hasData = false, reqTimer = null, lastRender = 0;

function esc(s) {
  return String(s === undefined || s === null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function setStatus(text, cls) {
  var el = document.getElementById('status');
  el.textContent = text;
  el.className = 'pill ' + (cls || '');
}
function requestNow() {
  if (ws && ws.readyState === 1) {
    hasData = false;
    ws.send(JSON.stringify({ type: 'request' }));
    setStatus('已请求最新数据…', 'warn');
  }
}
function connect() {
  try {
    ws = new WebSocket(WS_URL);
    ws.onopen = function () {
      setStatus('已连接 ' + WS_HOST + ' · 房间 ' + ROOM, 'ok');
      if (ws.readyState === 1) ws.send(JSON.stringify({ type: 'request' }));
      if (reqTimer) clearInterval(reqTimer);
      reqTimer = setInterval(function () {
        if (!hasData && ws && ws.readyState === 1) ws.send(JSON.stringify({ type: 'request' }));
      }, 2000);
    };
    ws.onmessage = function (e) {
      var m = null;
      try { m = JSON.parse(e.data); } catch (err) { return; }
      if (m && (m.type === 'state' || m.type === 'leaderboard') && m.payload) {
        hasData = true;
        setStatus('实时同步', 'ok');
        render(m.payload);
      } else if (m && m.type === 'presence') {
        var on = (m.teams || []).filter(function (t) { return t.online; }).length;
        setStatus('实时同步 · ' + on + ' 组在线' + (m.hostOnline ? '' : '（教师端离线）'), m.hostOnline ? 'ok' : 'warn');
      }
    };
    ws.onerror = function () { setStatus('连接错误 ' + WS_HOST, 'bad'); };
    ws.onclose = function () {
      setStatus('连接断开，重试中…', 'warn');
      hasData = false;
      if (reqTimer) clearInterval(reqTimer);
      setTimeout(connect, 2000);
    };
  } catch (e) { setStatus('初始化失败：' + e.message, 'bad'); }
}
connect();

function render(payload) {
  var teams = payload.teams || [];
  var students = payload.students || [];
  var meta = payload.meta || {};

  document.getElementById('courseTitle').textContent = payload.courseName || '课堂积分实时榜';

  var quizPill = document.getElementById('quizPill');
  if (meta.quizName) { quizPill.style.display = ''; quizPill.textContent = '试卷：' + meta.quizName; }
  else quizPill.style.display = 'none';

  if (meta.tierWeights && meta.tierWeights.length) {
    document.getElementById('tierHint').textContent = meta.tierWeights.map(function (t) {
      return t.label + ' ' + t.weight + '分';
    }).join(' / ');
  }

  /* 队伍榜 */
  var teamBox = document.getElementById('teamList');
  if (!teams.length) {
    teamBox.innerHTML = '<div class="empty">暂无队伍数据</div>';
  } else {
    var max = Math.max.apply(null, teams.map(function (t) { return Number(t.score) || 0; }).concat([1]));
    teamBox.innerHTML = teams.map(function (t, i) {
      var pct = Math.max(3, Math.round(((Number(t.score) || 0) / max) * 100));
      var color = t.color || '#66bb6a';
      return '<div class="team ' + (i < 3 ? 'top' + (i + 1) : '') + '" style="border-left-color:' + color + ';color:' + color + '">' +
        '<div class="rank">' + String(i + 1).padStart(2, '0') + '</div>' +
        '<div><div class="tname">' + esc(t.icon || '') + ' ' + esc(t.name) + '</div>' +
          '<div class="tsub">' + (t.memberCount || 0) + ' 人 · 人均 ' + (t.avg || 0) + ' · 得分率 ' + (t.creditRate || 0) + '%</div>' +
          '<div class="bar"><i style="width:' + pct + '%"></i></div></div>' +
        '<div class="tscore" style="color:#fff">' + (t.score || 0) + '</div>' +
      '</div>';
    }).join('');
  }

  /* 个人榜（按分数排序，最多 40 人） */
  var sorted = students.slice().sort(function (a, b) { return (b.score || 0) - (a.score || 0); }).slice(0, 40);
  var stuBox = document.getElementById('stuList');
  if (!sorted.length) {
    stuBox.innerHTML = '<li class="empty">暂无学生数据</li>';
  } else {
    stuBox.innerHTML = sorted.map(function (s, i) {
      return '<li class="' + (i < 3 ? 'top' + (i + 1) : '') + '" style="border-left-color:' + (s.color || '#66bb6a') + '">' +
        '<span class="rank">' + String(i + 1).padStart(2, '0') + '</span>' +
        '<span><span class="sname">' + esc(s.name) + '</span>' +
          '<span class="ssub"> ' + esc(s.teamName || '') + ' · 作答 ' + (s.attempts || 0) + ' · 得分率 ' + (s.creditRate || 0) + '%</span></span>' +
        '<span class="sscore">' + (s.score || 0) + '</span>' +
      '</li>';
    }).join('');
  }

  /* 当前题目（含选项与作答状态） */
  var qCard = document.getElementById('questionCard');
  if (meta.question) {
    qCard.style.display = '';
    document.getElementById('qStem').textContent = meta.question.fullStem || meta.question.stem || '';
    var tags = '<span class="qtag">' + esc(meta.question.tierLabel || '') + '</span>' +
      '<span class="qtag">' + esc(meta.question.typeLabel || '') + '</span>' +
      '<span class="qtag">答对 +' + (meta.question.points || 0) + ' 分</span>' +
      (meta.accepting ? '<span class="qtag qtag-live">● 正在作答</span>' : '') +
      (meta.reveal && meta.question.answerKey ? '<span class="qtag qtag-ans">答案：' + esc(meta.question.answerKey) + '</span>' : '');
    document.getElementById('qTags').innerHTML = tags;
    var optBox = document.getElementById('qOptions');
    if (meta.question.options && meta.question.options.length) {
      var revealKeys = (meta.reveal && meta.question.answerKey) ? meta.question.answerKey : '';
      optBox.style.display = '';
      optBox.innerHTML = meta.question.options.map(function (o) {
        var isAns = revealKeys && revealKeys.indexOf(o.key + '.') >= 0;
        return '<span class="opt' + (isAns ? ' opt-ans' : '') + '"><b>' + esc(o.key) + '</b>' + esc(o.text) + '</span>';
      }).join('');
    } else {
      optBox.style.display = 'none';
      optBox.innerHTML = '';
    }
  } else {
    qCard.style.display = 'none';
  }

  /* 抢答榜（学生端抢答时显示） */
  var buzzBox = document.getElementById('buzzCard');
  var buzz = meta.buzz || [];
  if (buzz.length) {
    buzzBox.style.display = '';
    document.getElementById('buzzList').innerHTML = buzz.slice(0, 6).map(function (b, i) {
      return '<span class="tick tick-buzz"><b>' + (i + 1) + '</b> ' + esc(b.teamName) + ' · ' + esc(b.sidName || '') + '</span>';
    }).join('');
  } else {
    buzzBox.style.display = 'none';
  }

  /* 最近得分滚动条 */
  var recent = meta.recent || [];
  document.getElementById('ticker').innerHTML = recent.map(function (r) {
    var color = r.points > 0 ? '#b9f6ca' : (r.points < 0 ? '#ffcdd2' : '#cfd8dc');
    return '<span class="tick">' + esc(r.name) + ' · ' + esc(r.tier || '') + ' ' + esc(r.result || '') +
      ' <b style="color:' + color + '">' + (r.points >= 0 ? '+' : '') + r.points + '</b></span>';
  }).join('');

  document.getElementById('footer').textContent = '最后更新 ' + new Date(payload.updatedAt || Date.now()).toLocaleString();
}
</script>
</body>
</html>
