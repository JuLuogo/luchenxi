<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>24机械高考公开课积分</title>
<style>
body{background:#eef2f5;margin:0;font-family:Segoe UI,Tahoma,Verdana,sans-serif;color:#2c3e50;padding:20px}
.wrap{max-width:1100px;margin:0 auto;padding:0 24px}
.card{background:#fff;border-radius:14px;box-shadow:0 12px 32px rgba(0,0,0,.12);padding:22px;border:1px solid rgba(0,0,0,.08)}
.title{font-size:2.2rem;margin:0 0 14px;text-align:center;letter-spacing:.5px}
.hint{opacity:.85;text-align:center;margin-bottom:14px;font-size:1.05rem}
.list{padding:12px;background:rgba(52,73,94,.05);border-radius:10px}
.item{display:grid;grid-template-columns:72px 1fr 120px;align-items:center;gap:14px;padding:12px 16px;margin-bottom:10px;background:#fff;border-radius:12px;border-left:5px solid #66bb6a;transition:.2s}
.item:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(0,0,0,.08)}
.item:nth-child(1){border-left-color:#f1c40f}
.item:nth-child(2){border-left-color:#bdc3c7}
.item:nth-child(3){border-left-color:#e67e22}
.rank{font-weight:700;color:#2c3e50;background:#e8f5e9;border:1px solid rgba(102,187,106,.45);border-radius:999px;padding:6px 10px;text-align:center}
.name{margin:0 6px;font-weight:600}
.score{text-align:right;font-weight:700;font-size:1.15rem;background:rgba(52,73,94,.05);padding:6px 10px;border-radius:10px}
.footer{margin-top:14px;text-align:center;font-size:1rem;opacity:.78}
.actions{text-align:center;margin-bottom:12px}
.btn{display:inline-block;padding:10px 16px;border-radius:10px;border:1px solid rgba(0,0,0,.12);background:#eef2f5;color:#2c3e50;cursor:pointer}
.btn:hover{background:#e3e8ee}
.empty{opacity:.7;text-align:center;padding:14px}
.icp{margin-top:18px;text-align:center;font-size:.95rem;opacity:.68}
.icp a{color:inherit;text-decoration:none}
@media (max-width:768px){
  .wrap{max-width:100%;padding:0 12px}
  .title{font-size:1.7rem}
  .item{grid-template-columns:52px 1fr 84px;padding:10px 12px}
  .score{font-size:1.05rem}
}
@media (min-width:1400px){
  .title{font-size:2.4rem}
  .item{grid-template-columns:80px 1fr 140px}
  .score{font-size:1.25rem}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h2 class="title">24机械高考公开课积分</h2>
    <div class="hint" id="status">等待数据</div>
    <div class="actions"><button class="btn" onclick="requestNow()">重新请求</button></div>
    <div class="list" id="list"></div>
    <div class="footer" id="footer"></div>
  </div>
  <div class="icp"><a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener noreferrer">冀ICP备2025122485号-1</a></div>
</div>
<script>
var WS_HOST='ws.peroe.top';
var WS_URL=(location.protocol==='https:'?'wss://':'ws://')+WS_HOST;
var ws;
var hasData=false;
var reqTimer=null;
function requestNow(){ if(ws && ws.readyState===1){ hasData=false; ws.send(JSON.stringify({type:'request'})); document.getElementById('status').textContent='已连接，已请求'; } }
function connect(){
  try{
    ws=new WebSocket(WS_URL);
    ws.onopen=function(){
      document.getElementById('status').textContent='已连接';
      if(ws.readyState===1){ ws.send(JSON.stringify({type:'request'})); }
      if(reqTimer) clearInterval(reqTimer);
      reqTimer=setInterval(function(){ if(!hasData && ws && ws.readyState===1){ ws.send(JSON.stringify({type:'request'})); } }, 2000);
    };
    ws.onmessage=function(e){
      try{
        var m=JSON.parse(e.data);
        if(m&&m.type==='leaderboard'&&m.payload&&Array.isArray(m.payload.teams)){
          hasData=true;
          render(m.payload.teams);
          document.getElementById('status').textContent='实时同步';
        }
      }catch{}
    };
    ws.onclose=function(){
      document.getElementById('status').textContent='连接断开，重试中…';
      hasData=false;
      if(reqTimer) clearInterval(reqTimer);
      setTimeout(connect,2000);
    };
  }catch{}
}
connect();
function render(teams){
  var list=document.getElementById('list');
  var sorted=(teams||[]).slice().sort(function(a,b){ return (b.score||0)-(a.score||0); });
  if(sorted.length===0){ list.innerHTML='<div class="empty">暂无数据</div>'; }
  else{ list.innerHTML=sorted.map(function(t,i){ return '<div class="item"><span class="rank">'+String(i+1).padStart(2,'0')+'</span><span class="name">'+(t.name||'')+'</span><span class="score">'+(t.score||0)+'</span></div>'; }).join(''); }
  var d=new Date();
  document.getElementById('footer').textContent='最后更新 '+d.toLocaleString();
}
</script>
</body>
</html>
