<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#4a5fc1">
<title>课堂小组端 · 答题 / 抢答 / 看板</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="assets/css/student.css">
</head>
<body>

<!-- 顶栏 -->
<div class="s-head" id="sHead">
  <div>
    <div class="course">课堂小组端</div>
    <div class="team">连接中…</div>
  </div>
</div>

<!-- 入座 -->
<section id="joinScreen" class="hidden"></section>

<!-- 主界面 -->
<section id="mainScreen" class="hidden">
  <div id="qaPane"></div>
  <div id="teamPane" class="hidden"></div>
  <div id="personalPane" class="hidden"></div>
  <div id="boardPane" class="hidden"></div>
</section>

<!-- 底部页签（展示模式自动隐藏） -->
<nav class="s-tabs" id="sTabs">
  <button id="tab-qa" class="on" onclick="CIStudent.switchTab('qa')"><span class="ico">✍️</span>答题</button>
  <button id="tab-team" onclick="CIStudent.switchTab('team')"><span class="ico">👥</span>本组</button>
  <button id="tab-personal" onclick="CIStudent.switchTab('personal')"><span class="ico">📈</span>我的</button>
  <button id="tab-board" onclick="CIStudent.switchTab('board')"><span class="ico">🏆</span>排行榜</button>
</nav>

<div id="toast"></div>

<script src="assets/js/student.js"></script>
</body>
</html>
