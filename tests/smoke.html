<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>端到端冒烟测试（Vue 界面）</title>
<link rel="icon" href="data:,">
<style>
  body{font-family:Consolas,monospace;margin:0;padding:10px;background:#111;color:#eee}
  #out{white-space:pre-wrap;font-size:13px;line-height:1.5}
  .pass{color:#7bd88f}.fail{color:#ff6b6b;font-weight:700}
  iframe{width:1280px;height:900px;border:1px solid #444;background:#fff}
  details{margin-top:10px}
</style>
</head>
<body>
<pre id="out">running…</pre>
<details><summary>被测页面（Vue 教师端 admin.html）</summary><iframe id="frame" src="/admin.html"></iframe></details>
<script>
/*!
 * 端到端冒烟（Vue 界面）：在真实浏览器里驱动 **构建产物** admin.html（同源 iframe）
 *
 *  2026-10 改写：原来驱动的是旧版零构建 admin.html（已删除）。
 *  现在驱动的是 Vue 应用，但**驱动方式不变** —— Vue 教师端把领域层暴露为 window.CI
 *  （见 web/src/shared/bridge.ts），所以造数据仍走同一批接口，
 *  断言则落在 Vue 渲染出来的 DOM 上（Element Plus 的类名/文案）。
 */
var lines = [], pass = 0, fail = 0;
function check(cond, label) {
  if (cond) { pass++; lines.push('PASS :: ' + label); }
  else { fail++; lines.push('FAIL :: ' + label); }
}
function log(s) { lines.push('     · ' + s); }
function flush() {
  document.getElementById('out').innerHTML =
    lines.map(function (l) { return '<span class="' + (l.indexOf('FAIL') === 0 ? 'fail' : (l.indexOf('PASS') === 0 ? 'pass' : '')) + '">' +
      l.replace(/&/g, '&amp;').replace(/</g, '&lt;') + '</span>'; }).join('\n') +
    '\nSMOKE RESULT: ' + pass + ' pass / ' + fail + ' fail\nSMOKE ' + (fail ? 'FAILED' : 'DONE');
}
function wait(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
/** 等到条件成立（Vue 渲染是异步的，断言前必须等） */
async function until(fn, ms, label) {
  var t0 = Date.now();
  while (Date.now() - t0 < (ms || 5000)) {
    try { if (fn()) return true; } catch (e) { /* 还没渲染好 */ }
    await wait(120);
  }
  log('超时等待：' + (label || ''));
  return false;
}
/** 切到某个 Vue 路由并等它渲染 */
async function goto(w, hash, label) {
  w.location.hash = hash;
  await until(function () { return (w.document.body.innerText || '').length > 30; }, 6000, label || hash);
  await wait(600);
  return w.document.body.innerText || '';
}

window.addEventListener('load', function () {
  try {
    var w0 = document.getElementById('frame').contentWindow;
    w0.localStorage.setItem('ci_ws_host', location.host);
    w0.localStorage.setItem('ci_room', 'smoke-vue');   // 独立房间，避免载入枢纽里的其它课堂数据
    w0.CI.sync.setHost(location.host);
  } catch (e) { /* 忽略 */ }
  setTimeout(run, 400);
});

async function run() {
  var w = document.getElementById('frame').contentWindow;
  var d = w.document;
  var CI = w.CI;
  var S = CI.store;

  try {
    /* ---------- 0. 屏蔽阻塞式对话框 ---------- */
    w.alert = function () { log('（已抑制 alert）'); };
    w.confirm = function () { return true; };
    w.prompt = function (msg, dft) { return dft === undefined ? '冒烟测试' : dft; };

    /* ---------- 1. 页面装配 ---------- */
    await until(function () { return w.CI && w.CI.store; }, 8000, '领域层加载');
    check(!!(CI && CI.store && CI.analysis && CI.classroom), '模块加载：store / analysis / classroom 存在');
    check(await until(function () { return d.querySelector('#app') && d.querySelector('#app').children.length > 0; }, 8000, 'Vue 挂载'),
      'Vue 应用已挂载');
    check(d.querySelectorAll('.el-menu, .el-aside, .el-container').length > 0, '侧边栏 / 布局渲染');
    check(d.querySelectorAll('.el-button, .el-card, .el-menu-item').length >= 5, 'Element Plus 组件渲染（≥5）');
    check(!Array.from(d.scripts).some(function (s) { return (s.src || '').indexOf('assets/js/') >= 0; }),
      '没有引用旧版 assets/js（界面已统一到 Vue）');

    /* ---------- 2. 班级与积分 ---------- */
    S.replaceState(S.defaultState());
    var team = S.get().teams[0].id;
    S.addStudentsBulk('甲\n乙\n丙\n丁', team);
    check(S.get().students.length >= 4, '批量添加 4 名学生');
    var classText = await goto(w, '#/class', '班级页');
    check(classText.indexOf('甲') >= 0 && classText.indexOf('丁') >= 0, '班级页渲染出学生姓名');
    S.addManual(S.get().students[0].id, 2);
    check(S.scoreOf(S.get(), S.get().students[0].id) === 2, '手动 +2 记分成功（防通胀上限内）');
    S.addManual(S.get().students[0].id, 5);
    check(S.scoreOf(S.get(), S.get().students[0].id) === 4, '手动 +5 被上限收敛为 +2（防通胀生效）');

    /* ---------- 3. 题库与导入 ---------- */
    var q1 = S.addQuestion({ stem: '基础题：1+1=?', tier: 'basic', answer: '2', options: ['1', '2', '3'] });
    var q2 = S.addQuestion({ stem: '拔高题：求导', tier: 'advanced', answer: '2x' });
    var bankText = await goto(w, '#/bank', '题库页');
    check(bankText.indexOf('1+1') >= 0, '题库列表渲染出题干');
    var parsed = CI.bankImport.parse('基础题：集合A={1,2}，子集个数？ | 4\n函数 y=x² 对称轴？ | x=0', S.get().tiers);
    check(parsed.length === 2, '文本解析 2 题（CI.bankImport，Rust 侧同契约）');
    check(parsed[0].tier === 'basic', '识别「基础题：」前缀');
    var parsedChoice = CI.bankImport.parse('下列哪个是质数？ | 4 ; 6 ; 7 ; 9 | C');
    check(parsedChoice[0].options.length === 4 && parsedChoice[0].answer === 'C', '文本解析选择题选项与答案');
    var imported = S.bulkImportQuestions(parsed, { dedupe: true });
    check(imported.added === 2, '导入后新增 2 题');
    check(S.get().bank.length === 4, '题库共 4 题');

    /* ---------- 4. 组卷 ---------- */
    var qz = S.createQuiz('冒烟卷', [q1.id, q2.id]);
    S.setCurrentQuiz(qz.id);
    check(!!S.quiz(S.get(), qz.id), '创建试卷成功');
    var editorText = await goto(w, '#/papers/' + qz.id, '组卷页');
    check(editorText.indexOf('1+1') >= 0, '组卷编辑器渲染出题目');
    check(editorText.indexOf('冒烟卷') >= 0, '组卷编辑器显示试卷名');

    /* ---------- 5. 判分与统计 ---------- */
    S.setRuntime({ qid: q1.id, quizId: qz.id });
    var rec = S.recordResult({ sid: S.get().students[0].id, qid: q1.id, tier: 'basic', result: 'correct', quizId: qz.id, picked: 'B' });
    check(rec && rec.points === 3, '客观题判分 +3（基础题权重）');
    var halfRec = S.recordResult({ sid: S.get().students[1].id, qid: q2.id, tier: 'advanced', result: 'half', ratio: 0.75, quizId: qz.id });
    check(halfRec && halfRec.points === 3.75, '部分得分按比例：5 × 0.75 = 3.75');
    var stats = CI.analysis.studentStats(S.get(), S.get().students[0].id);
    check(stats.total.attempts === 1 && stats.total.correct === 1, '学生统计到 1 次作答、1 次答对');

    /* ---------- 6. 点名 ---------- */
    var pick = CI.rollcall.pick(S.get(), {});
    check(!!pick && !!pick.sid, '点名抽到一名学生');
    CI.rollcall.applyPick(pick);
    check(S.get().rollcall.history.length === 1, '点名历史记录 1 条');
    var rollText = await goto(w, '#/roll', '点名页');
    check(rollText.length > 30, '点名页有内容');

    /* ---------- 7. 学情分析（含新功能：综合表现 / 错题本 / 课堂报告） ---------- */
    var analysisText = await goto(w, '#/analysis', '学情页');
    check(analysisText.indexOf('甲') >= 0, '学情分析页渲染出学生');
    check(analysisText.indexOf('综合表现') >= 0, '学情分析页有「综合表现」列（多维度评价）');
    var ev = CI.analysis.studentEvaluation(S.get(), S.get().students[0].id, { quizId: qz.id });
    check(ev && ev.total > 0 && ev.parts.length === 3, '综合表现可下钻（三维）');
    check(ev.participation === 50, '参与度 = 50%（试卷 2 题、只答了 1 题 —— 答错也算参与，但没答就不算）');
    var sum = CI.analysis.summarizeClass(S.get(), null, { quizId: qz.id });
    check(sum.lines.length > 0 && sum.text.indexOf('学情小结') >= 0, '班级学情小结可生成');
    var rep = CI.analysis.classReport(S.get(), { quizId: qz.id });
    check(rep.markdown.indexOf('课堂报告') >= 0 && rep.markdown.indexOf('## 一、出勤') >= 0, '课后课堂报告可生成（含出勤节）');
    check(CI.analysis.mistakeBoard(S.get(), { quizId: qz.id }).length === 0, '错题本：没有错题时为空');

    /* ---------- 8. 课堂协同（计时器 / 签到 / 抢答） ---------- */
    var clsText = await goto(w, '#/classroom', '协同页');
    check(clsText.length > 50, '课堂协同页渲染');
    CI.classroom.setTimer(60, '随堂练习');
    check(CI.classroom.timerLeft() > 0, '计时器已启动');
    check(CI.classroom.metaPayload().timerEndsAt > 0, '快照带出计时结束时刻（大屏/学生端同步用）');
    CI.classroom.clearTimer();
    check(CI.classroom.timerLeft() === null, '计时器已停止');
    CI.classroom.setPresence({ hostOnline: true, teams: [{ teamId: team, online: true, label: '红队', at: Date.now() }] });
    var ck = CI.classroom.checkinStats(S.get());
    check(ck.seated === 1 && ck.total === S.get().teams.length, '签到统计：1 队已入座');

    /* ---------- 9. 同步快照 ---------- */
    var snap = CI.sync.snapshot();
    check(snap.teams.length === S.get().teams.length, '快照含全部队伍');
    check(snap.students.length === S.get().students.length, '快照含全部学生');
    check(snap.meta && Array.isArray(snap.meta.tierWeights) && snap.meta.tierWeights.length === 4, '快照含题型权重（4 个）');
    check(snap.meta.recent.length >= 1, '快照含最近得分事件');

    /* ---------- 10. 三个入口都是 Vue 产物 ---------- */
    var stageRes = await fetch('/stage');
    var stageHtml = await stageRes.text();
    check(stageRes.status === 200 && stageHtml.indexOf('./assets/') >= 0, '大屏入口 /stage 指向 Vue 产物');
    var joinRes = await fetch('/join');
    var joinHtml = await joinRes.text();
    check(joinRes.status === 200 && joinHtml.indexOf('./assets/') >= 0, '学生端入口 /join 指向 Vue 产物');

    /* ---------- 10.5 领域端点（Rust 核心） ---------- */
    // 前端"Rust 优先、回退 JS"的两条路径都要在真实环境里过一遍：
    //   · 打 Rust 枢纽时，端点必须返回可用结果
    //   · 打 Node 枢纽（deprecated）时端点不存在，应走回退 —— 不算失败
    {
      const students = S.get().students.map((x) => ({ id: x.id, name: x.name, active: true, called: 0 }));
      const probe = await fetch('/api/domain/stats', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ state: S.defaultState() })
      });
      if (!probe.ok) {
        log('领域端点不可用（HTTP ' + probe.status + '）→ 前端会走本地参考实现');
        check(true, '领域端点缺失时前端有回退路径（不报错）');
      } else {
        check(true, '领域端点 /api/domain/stats 可用（Rust 核心在跑）');

        const readJson = async (url, body) => {
          const res = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
          const text = await res.text();
          try { return { ok: res.ok, json: JSON.parse(text) }; }
          catch (e) { log(url + ' 返回的不是 JSON：' + text.slice(0, 200)); return { ok: false, json: {} }; }
        };

        /* ① 点名：可复现 */
        const pickBody = {
          students, answered: [],
          settings: { mode: 'even', scope: 'all', exclude_answered: false, recent_exclude: 0, round: 1, round_pool: [], history: [] },
          opts: { scope: 'all', mode: 'even', has_current_question: false },
          seed: 20261003
        };
        const pk = await readJson('/api/domain/pick', pickBody);
        check(pk.ok && pk.json.ok && pk.json.pick && !!pk.json.pick.sid, '领域端点 /api/domain/pick 返回有效学生');
        check(pk.json.seed === 20261003, '点名回传随机种子（可复现）');
        const pk2 = await readJson('/api/domain/pick', pickBody);
        check(pk2.json.pick && pk2.json.pick.sid === pk.json.pick.sid, '同种子点出同一个人（可复现）');

        /* ② 能力榜：全班 + 每人 + 每队，范围要贯穿 */
        const ab = await readJson('/api/domain/ability-board', { state: S.get(), quizId: null });
        check(ab.ok && ab.json.ok && !!(ab.json.board && ab.json.board.class), '领域端点 /api/domain/ability-board 返回全班画像');
        if (ab.json.board) {
          check(ab.json.board.students.length === S.get().students.length, '能力榜覆盖全部学生（' + ab.json.board.students.length + ' 人）');
          check(ab.json.board.teams.length === S.get().teams.length, '能力榜覆盖全部队伍');
          check(Array.isArray(ab.json.board.class.axes) && ab.json.board.class.axes.length === S.get().tiers.length, '画像含全部题型的轴');
        }
        const ab2 = await readJson('/api/domain/ability-board', { state: S.get(), quizId: S.get().currentQuizId });
        if (ab2.json.board && ab.json.board) {
          check(ab2.json.board.class.attempts <= ab.json.board.class.attempts, '数据范围贯穿到能力榜（本节课 ≤ 全部课次）');
        }

        /* ③ 判分：客观题判得出，主观题返回 graded:false */
        const qBase = { options: ['1', '2', '3'], answer: 'A', tier: 'basic', points: null };
        const g1 = await readJson('/api/domain/grade', { question: qBase, submission: { choice: ['A'], text: '', skip: false } });
        check(g1.ok && g1.json.graded === true && g1.json.result === 'correct', '领域端点 /api/domain/grade 判对');
        // 主观题 = **没有标准答案**的题（有答案但学生没选，会被判成 skip，不是 graded:false）
        const qSubj = { options: [], answer: '', tier: 'advanced', points: null };
        const g2 = await readJson('/api/domain/grade', { question: qSubj, submission: { choice: [], text: '我的证明', skip: false } });
        check(g2.json.graded === false, '主观题返回 graded:false（前端据此进待确认队列）');

        /* ④ 计分：题型权重 + 抢答加分 */
        const s1 = await readJson('/api/domain/score', { input: { sid: 's1', qid: 'q1', tier: 'basic', questionTier: 'basic', result: 'correct' } });
        check(s1.ok && s1.json.snapshot && s1.json.snapshot.points === 3, '领域端点 /api/domain/score 按题型权重给 3 分');
        const s2 = await readJson('/api/domain/score', { settings: { fastBonus: 1 }, input: { sid: 's1', qid: 'q1', tier: 'basic', questionTier: 'basic', result: 'correct', fast: true } });
        check(s2.json.snapshot && s2.json.snapshot.points === 4, '计分端点应用抢答加分（3 + 1 = 4）');
      }
    }

    /* ---------- 10.6 界面真的在用 Rust 吗 ---------- */
    // 端点可用 ≠ 界面在用。学情页会标出统计来源，正好断言这条策略：
    //   打 Rust 枢纽 → 「Rust 核心」；打 Node 枢纽 → 「本地参考实现」
    {
      const hasStats = (await fetch('/api/domain/stats', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ state: S.defaultState() })
      })).ok;
      await goto(w, '#/analysis', '学情页');
      const pageText = d.body.innerText || '';
      if (hasStats) {
        check(pageText.indexOf('Rust 核心') >= 0, '学情页标注「统计来源：Rust 核心」（界面确实在用 Rust）');
      } else {
        check(pageText.indexOf('本地参考实现') >= 0, '学情页标注「统计来源：本地参考实现」（端点缺失时回退）');
      }
    }

    /* ---------- 11. 服务端与数据库（经枢纽） ---------- */
    // 注意带上房间名：应用用的是 ci_room（本用例是 smoke-vue），不带参数会读到 default 房间
    var room = encodeURIComponent(CI.sync.room ? CI.sync.room() : 'default');
    var st = await (await fetch('/api/state?room=' + room)).json();
    check(!!(st && st.state && Array.isArray(st.state.students)) && st.state.students.length === S.get().students.length,
      '/api/state 能读回完整课堂数据（房间 ' + room + '：' + (st && st.state ? st.state.students.length : '?') + ' 名学生）');
    var stats2 = await (await fetch('/api/stats?room=' + room)).json();
    check(!!stats2 && stats2.ok !== false, 'SQL 统计接口 /api/stats 可用');
    log('/api/stats 顶层键：' + Object.keys(stats2 || {}).join(', '));
  } catch (e) {
    fail++;
    lines.push('FAIL :: 用例执行异常：' + (e && e.message));
    log(String(e && e.stack || '').split('\n').slice(0, 3).join(' / '));
  }

  flush();
}
</script>
</body>
</html>
