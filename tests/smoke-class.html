<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>多端协同端到端（Vue：教师端 + 学生端 + 大屏）</title>
<link rel="icon" href="data:,">
<style>
  body{font-family:Consolas,monospace;margin:0;padding:10px;background:#111;color:#eee}
  #out{white-space:pre-wrap;font-size:13px;line-height:1.5}
  .pass{color:#7bd88f}.fail{color:#ff6b6b;font-weight:700}
  iframe{border:1px solid #444;background:#fff}
  details{margin-top:8px}
</style>
</head>
<body>
<pre id="out">running…</pre>
<details><summary>教师端（Vue）</summary><iframe id="hostFrame" style="width:900px;height:600px"></iframe></details>
<details><summary>学生端（Vue）</summary><iframe id="stuFrame" style="width:380px;height:600px"></iframe></details>
<details><summary>大屏（Vue）</summary><iframe id="stageFrame" style="width:600px;height:400px"></iframe></details>
<script>
/*!
 * 多端协同端到端（Vue 三端）：教师端 + 学生端 + 大屏，同一个枢纽房间
 *
 *  2026-10 改写：原来驱动的是旧版零构建页面（已删除）。现在三个 iframe 都是 Vue 构建产物：
 *    /admin.html  教师端（把领域层暴露为 window.CI）
 *    /join        学生端（状态机仍由 student.js 提供，暴露 window.CIStudent）
 *    /stage       大屏（只读，断言落在渲染出来的文案上）
 */
var lines = [], pass = 0, fail = 0;
function check(cond, label) {
  if (cond) { pass++; lines.push('PASS :: ' + label); }
  else { fail++; lines.push('FAIL :: ' + label); }
}
function log(s) { lines.push('     · ' + s); }
function flush() {
  document.getElementById('out').innerHTML =
    lines.map(function (l) { return '<span class="' + (l.indexOf('FAIL') === 0 ? 'fail' : (l.indexOf('PASS') === 0 ? 'pass' : '')) + '">' +
      l.replace(/&/g, '&amp;').replace(/</g, '&lt;') + '</span>'; }).join('\n') +
    '\nSMOKE RESULT: ' + pass + ' pass / ' + fail + ' fail\nSMOKE ' + (fail ? 'FAILED' : 'DONE');
}
function wait(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
async function until(fn, ms, label) {
  var t0 = Date.now();
  while (Date.now() - t0 < (ms || 6000)) {
    try { if (fn()) return true; } catch (e) { /* 还没好 */ }
    await wait(120);
  }
  log('超时等待：' + (label || ''));
  return false;
}

var ROOM = 'smokeclass-' + Math.random().toString(36).slice(2, 8);
var host, stu, stage;

async function boot() {
  host = document.getElementById('hostFrame');
  stu = document.getElementById('stuFrame');
  stage = document.getElementById('stageFrame');

  // 关键：三个 iframe 同源，**先**在父页面写 localStorage，再挂 src ——
  // 否则子页面加载时读到的是默认房间，会连到别处（"教师端看不到学生"的头号原因）
  localStorage.setItem('ci_ws_host', location.host);
  localStorage.setItem('ci_room', ROOM);

  host.src = '/admin.html';
  await until(function () { return host.contentWindow && host.contentWindow.CI && host.contentWindow.CI.store; }, 9000, '教师端领域层');
  var hw = host.contentWindow;
  hw.CI.sync.setHost(location.host);
  hw.alert = function () {}; hw.confirm = function () { return true; }; hw.prompt = function (m, d) { return d === undefined ? '冒烟' : d; };

  var HC = hw.CI, HS = HC.store;
  HS.replaceState(HS.defaultState());
  var t1 = HS.get().teams[0].id, t2 = HS.get().teams[1].id;
  HS.addStudentsBulk('甲\n乙', t1);
  HS.addStudentsBulk('丙', t2);
  check(HS.get().students.length === 3, '教师端建了 3 名学生 / 2 支队伍');

  // 学生端从 URL 参数读房间与队伍（扫码入座就是这个地址），所以先把队伍建好再挂 src
  stu.src = '/join?room=' + encodeURIComponent(ROOM) + '&team=' + encodeURIComponent(t1);
  await until(function () { return stu.contentWindow && stu.contentWindow.CIStudent; }, 9000, '学生端状态机');
  var sw = stu.contentWindow;
  sw.alert = function () {}; sw.confirm = function () { return true; }; sw.prompt = function (m, d) { return d === undefined ? '冒烟' : d; };

  stage.src = '/stage?room=' + ROOM;
  await until(function () { return stage.contentWindow && (stage.contentWindow.document.body.innerText || '').length > 10; }, 9000, '大屏渲染');

  return { HC: HC, HS: HS, hw: hw, sw: sw, t1: t1, t2: t2 };
}

async function run() {
  try {
    var ctx = await boot();
    var HC = ctx.HC, HS = ctx.HS, hw = ctx.hw, sw = ctx.sw, t1 = ctx.t1;

    /* ---------- 1. 三端都是 Vue 产物 ---------- */
    check(!Array.from(hw.document.scripts).some(function (s) { return (s.src || '').indexOf('assets/js/') >= 0; }), '教师端没有旧版脚本');
    check(!Array.from(sw.document.scripts).some(function (s) { return (s.src || '').indexOf('assets/js/') >= 0; }), '学生端没有旧版脚本');
    check(!!sw.CIStudent, '学生端状态机可用（CIStudent）');
    check(hw.document.querySelectorAll('.el-menu, .el-aside').length > 0, '教师端 Vue 布局渲染');

    /* ---------- 2. 学生入座 → 教师端看到在线 ---------- */
    if (sw.CIStudent.setTeam) sw.CIStudent.setTeam(t1);
    if (sw.CIStudent.init) sw.CIStudent.init();
    await wait(1500);
    var okOnline = await until(function () {
      var p = HC.classroom.presence();
      return p && p.teams && p.teams.some(function (t) { return t.online; });
    }, 9000, '教师端看到在线队伍');
    check(okOnline, '学生端入座后教师端看到在线');
    var ck = HC.classroom.checkinStats(HS.get());
    check(ck.total === 2, '签到统计总数 = 2 支队伍');
    check(ck.seated >= 1, '签到统计：至少 1 队已入座（实际 ' + ck.seated + '）');

    /* ---------- 3. 出题 → 学生端能作答 ---------- */
    var q = HS.addQuestion({ stem: '1+1=?', tier: 'basic', answer: 'A', options: ['1', '2', '3', '4'] });
    var qz = HS.createQuiz('协同冒烟卷', [q.id]);
    HS.setCurrentQuiz(qz.id);
    HC.classroom.setPhase('question');
    HC.classroom.setAccepting(true);
    await wait(1500);
    check(HC.classroom.phase(HS.get()) === 'question', '教师端切到「出题答题」环节');
    var snap = HC.sync.snapshot();
    check(!!(snap.meta && snap.meta.question && snap.meta.question.options.length === 4), '快照含题目与 4 个选项');
    check(snap.meta.accepting === true, '快照含作答开关（已开放）');
    check((sw.document.body.innerText || '').indexOf('1+1') >= 0, '学生端渲染出题干');

    /* ---------- 4. 抢答 ---------- */
    HC.classroom.addBuzz({ teamId: t1, sid: HS.get().students[0].id, qid: q.id });
    await wait(800);
    var meta = HC.classroom.metaPayload();
    check(meta.buzz.length === 1, '抢答榜记录 1 条');
    check(meta.buzz[0].teamName.length > 0, '抢答榜带队伍名');

    /* ---------- 5. 客观题作答 → 教师端实时流 ---------- */
    var rec = HS.recordResult({ sid: HS.get().students[0].id, qid: q.id, tier: 'basic', result: 'correct', quizId: qz.id, picked: 'A', source: 'student' });
    check(rec && rec.points === 3, '客观题自动判分 +3');
    check(HC.classroom.metaPayload().feed.length >= 1, '教师端实时流出现判定结果');

    /* ---------- 6. 主观题 → 待确认 → 判定 ---------- */
    var q2 = HS.addQuestion({ stem: '请写出证明过程', tier: 'advanced', answer: '' });
    HS.setRuntime({ qid: q2.id, quizId: qz.id });
    // 走**真实的命令路径**（学生端经枢纽发上来的就是这条）：主观题应进待确认队列
    HC.classroom.handleCmd({ kind: 'answer', team: t1, student: HS.get().students[1].id, q: q2.id, text: '我的证明' });
    check(HC.classroom.metaPayload().pending.length === 1, '主观题进入待确认队列');
    var pid = HC.classroom.metaPayload().pending[0].id;
    HC.classroom.resolvePending(pid, 'correct');
    check(HC.classroom.metaPayload().pending.length === 0, '判定后待确认队列清空');

    /* ---------- 7. 公布答案 → 快照带出答案与讲评要点 ---------- */
    HS.setRuntime({ qid: q.id, quizId: qz.id });
    HC.classroom.setReveal(true);
    await wait(1200);
    // 注意：question 由 sync.snapshot() 组装（metaPayload 里没有它）
    var meta2 = HC.sync.snapshot().meta;
    check(!!(meta2.question && meta2.question.answerKey), '公布答案后快照带出正确答案');
    check(typeof meta2.question.explanation === 'string', '快照带出讲评要点字段（公布后才下发）');
    check(meta2.reveal === true, '快照带出「已公布答案」开关');

    /* ---------- 8. 快照与枢纽持久化 ---------- */
    var snap2 = HC.sync.snapshot();
    check(snap2.teams.length === 2, '快照含 2 支队伍');
    check(snap2.students.length === 3, '快照含 3 名学生');
    check(snap2.meta.tierWeights.length === 4, '快照含 4 个题型权重');
    await wait(3000);   // 等一次节流推送（枢纽按节流落库）
    var dump = await (await fetch('/api/state?room=' + encodeURIComponent(ROOM))).json();
    check(!!(dump && dump.state), '枢纽上存有该房间的课堂数据');
    if (dump && dump.state) {
      check((dump.state.students || []).length === 3, 'dump 含完整名单（3 名学生）');
      // 注意：/api/state 的 state 是**广播快照**（不含题库），完整数据在 dump 字段里
      var full = dump.dump || {};
      check((full.bank || []).length >= 1, 'dump 含题库（' + (full.bank || []).length + ' 题）');
      check((full.quizzes || []).length >= 1, 'dump 含试卷（' + (full.quizzes || []).length + ' 套）');
    }

    /* ---------- 9. 大屏与选项分布（新的"40% 的人选了 B"） ---------- */
    check((stage.contentWindow.document.body.innerText || '').length > 20, '大屏有内容');
    var meta3 = HC.classroom.metaPayload();
    check(Array.isArray(meta3.optionDist), '快照带出选项分布');
    check(meta3.optionDist.length === 4, '选项分布 4 条（对应 4 个选项）');
    check(meta3.optionDist[0].count === 1 && meta3.optionDist[0].correct === true, '分布里正确项被标出且计到 1 票');
    check(Array.isArray(meta3.hardestQuestions), '快照带出讲评建议（正确率最低的题）');

    /* ---------- 10. 计时器与环节切换 ---------- */
    HC.classroom.setTimer(30, '小组讨论');
    check(HC.classroom.metaPayload().timerEndsAt > 0, '计时器启动并进快照');
    HC.classroom.clearTimer();
    HC.classroom.setPhase('review');
    await wait(900);
    check(HC.classroom.phase(HS.get()) === 'review', '切到「点评总结」环节');
    check(HC.classroom.metaPayload().phase === 'review', '快照带出环节（大屏据此切屏）');
  } catch (e) {
    fail++;
    lines.push('FAIL :: 用例执行异常：' + (e && e.message));
    log(String(e && e.stack || '').split('\n').slice(0, 3).join(' / '));
  }
  flush();
}

window.addEventListener('load', function () { setTimeout(run, 300); });
</script>
</body>
</html>
