name: test

# 每次推送/PR 都跑。
# 步骤集中在一个脚本里（scripts/ci-local.mjs），本地 `npm run ci` 与 CI 用的是同一份逻辑，
# 不会出现"CI 里是另一套命令"的漂移。
#
# 注意：Node 用 24。枢纽的 SQLite 走 node:sqlite —— 它在 Node 22.x 仍需要
# --experimental-sqlite 开关（未开时会抛错，数据库断言全挂），Node 24 起才默认可用。
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    name: 十二组断言 + 两条浏览器端到端
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: 安装依赖
        run: npm install

      # 用官方 action 装**真正的 Chrome**：ubuntu 24.04 仓库里的 chromium-browser 是 snap 壳，
      # 装上了也跑不起来（之前的 test 工作流就是卡在浏览器端到端这一步）。
      - name: 准备无头浏览器（端到端要用）
        uses: browser-actions/setup-chrome@v2
        id: chrome
        with:
          chrome-version: stable

      - name: 记录浏览器路径
        run: echo "CHROME_PATH=${{ steps.chrome.outputs.chrome-path }}" >> $GITHUB_ENV

      - name: 运行 CI（产物生成 → 十二组断言 → 文档审计 → 两条端到端）
        # SKIP_CARGO：本作业没装 Tauri 的 Linux 依赖（webkit2gtk 等），
        # 而 ubuntu runner 自带 Rust，ci-local 会顺带跑 cargo test 并失败。
        # Rust 由 rust.yml 负责（那边装了依赖）。这样两个作业职责清晰、都更快。
        env:
          SKIP_CARGO: '1'
        run: node scripts/ci-local.mjs

      - name: 失败时把结论写进 Job Summary（无需授权即可查看）
        if: failure()
        run: node scripts/ci-summary.mjs || true

      - name: 失败时上传截图等工件
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ci-failure-artifacts
          path: |
            docs/screenshots
            docs/screenshots-next
          if-no-files-found: ignore
