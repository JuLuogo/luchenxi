name: demo

# 手动触发：在 CI 上跑一遍整堂演示，产出截图 artifact。
# 什么时候用：想确认"当前提交的界面到底长什么样"、或给评审/同事看效果时。
# 它不参与 push 门禁（跑浏览器较慢），所以只挂 workflow_dispatch。
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  demo:
    name: 整堂演示（真实页面 + 逐步截图）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 安装依赖
        run: npm install

      - name: 准备无头浏览器
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium-browser || sudo apt-get install -y chromium
          if [ -x /usr/bin/chromium-browser ]; then echo "CHROME_PATH=/usr/bin/chromium-browser" >> $GITHUB_ENV; fi
          if [ -x /usr/bin/chromium ]; then echo "CHROME_PATH=/usr/bin/chromium" >> $GITHUB_ENV; fi

      - name: 跑演示（自起枢纽 + 教师端/学生端/大屏）
        run: node tests/demo.js

      - name: 上传截图与实录
        uses: actions/upload-artifact@v4
        with:
          name: demo-screenshots
          path: docs/demo
          if-no-files-found: error
