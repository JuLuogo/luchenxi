name: demo

# 手动触发：在 CI 上跑一遍整堂演示，产出截图 artifact。
# 什么时候用：想确认"当前提交的界面到底长什么样"、或给评审/同事看效果时。
# 它不参与 push 门禁（跑浏览器较慢），所以只挂 workflow_dispatch。
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  demo:
    name: 整堂演示（真实页面 + 逐步截图）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: 安装依赖
        run: npm install

      # 同 test.yml：用官方 action 装真 Chrome（ubuntu 24.04 的 chromium-browser 是 snap 壳）
      - name: 准备无头浏览器
        uses: browser-actions/setup-chrome@v2
        id: chrome
        with:
          chrome-version: stable

      - name: 记录浏览器路径
        run: echo "CHROME_PATH=${{ steps.chrome.outputs.chrome-path }}" >> $GITHUB_ENV

      - name: 跑演示（自起枢纽 + 教师端/学生端/大屏）
        run: node tests/demo.js

      - name: 失败时写 Job Summary
        if: failure()
        run: node scripts/ci-summary.mjs || true

      - name: 上传截图与实录
        uses: actions/upload-artifact@v7
        with:
          name: demo-screenshots
          path: docs/demo
          if-no-files-found: error
