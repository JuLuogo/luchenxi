name: rust

# 真正编译并运行 Rust 侧（内置枢纽 + SQLite + 组网参数）。
# 为什么要单独一个工作流：本机没有 Rust 工具链（也没有 MSVC/MinGW 链接器），
# 所以 apps/ 下的 Rust 只有在 CI 上才可能被验证 —— 这里是唯一的真相来源。
#
# 失败时会把编译错误写成 GitHub 注解（::error::），这样即使拿不到完整日志，
# 也能在 check-run 注解里直接看到具体 crate / 行号。
on:
  push:
    branches: ['**']
    paths:
      - 'apps/**'
      - 'packages/protocol/**'
      - 'scripts/gen-protocol.mjs'
      - 'scripts/sync-ui.mjs'
      - '.github/workflows/rust.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cargo-test:
    name: cargo test（教师端 lib + 枢纽一致性）
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      # Tauri v2 官方 Linux 依赖清单。
      # 注意：不要写 libappindicator3-dev（22.04 仓库里没有这个包名，apt 会以 exit 100 直接失败）。
      - name: Tauri 在 Linux 上的系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libxdo-dev libssl-dev patchelf build-essential curl wget file

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'apps/teacher/src-tauri'

      - name: 生成前端资源与契约常量（generate_context! 会检查 ui/ 与 icons/）
        run: |
          node scripts/sync-ui.mjs teacher
          node scripts/gen-protocol.mjs --check

      - name: 单元测试 + 枢纽一致性测试
        working-directory: apps/teacher/src-tauri
        run: |
          set -o pipefail
          cargo test --all-targets -- --nocapture 2>&1 | tee cargo-test.log

      - name: 编译检查（学生端）
        working-directory: apps/student/src-tauri
        run: |
          set -o pipefail
          node ../../../scripts/sync-ui.mjs student
          cargo check --all-targets 2>&1 | tee cargo-check.log

      - name: 失败时把编译错误写成注解
        if: failure()
        working-directory: apps/teacher/src-tauri
        run: |
          for f in cargo-test.log ../student/src-tauri/cargo-check.log; do
            [ -f "$f" ] || continue
            echo "==== $f 的错误行 ===="
            grep -nE '^error(\[|:)|^error: ' "$f" | head -30 | while IFS= read -r l; do echo "::error file=$f::$l"; done || true
            echo "==== $f 日志尾部 ===="
            tail -50 "$f" || true
          done
