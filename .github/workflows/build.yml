name: build

# 出安装包：推 tag（v*）或手动触发。
# 产物：Windows .msi、macOS .dmg、Linux .deb/.AppImage、Android .apk；tag 时挂到 Draft Release。
#
# 说明：这里**不再用 tauri-action**，而是显式跑客户端的 `npm run build`（即 tauri build）——
# 原因是 tauri-action 失败时只给一句 "Command failed with exit code 1"，看不到真正的编译错误；
# 显式跑可以把日志 tee 下来，并把 error[..] 行写成 GitHub 注解（::error::），
# 这样即使没有完整日志权限也能定位问题。
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      who:
        description: '要构建哪个客户端'
        type: choice
        options: [both, teacher, student]
        default: both

env:
  CARGO_TERM_COLOR: always
  EASYTIER_VERSION: v2.2.2

permissions:
  contents: write

jobs:
  # ------------------------------------------------------------------
  # 先把两套客户端的前端资源（复用仓库根目录的网页版）拷进各自 ui/ 目录
  # ------------------------------------------------------------------
  prepare-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: node scripts/sync-ui.mjs
      - uses: actions/upload-artifact@v7
        with:
          name: ui
          path: |
            apps/teacher/ui
            apps/student/ui

  desktop:
    needs: prepare-ui
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            app: teacher
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            app: student
          - os: macos-14
            target: aarch64-apple-darwin
            app: teacher
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            app: teacher
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: '${{ matrix.target }}'
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'apps/${{ matrix.app }}/src-tauri'

      # Tauri v2 官方 Linux 依赖（不要写 libappindicator3-dev：22.04 无此包名，apt 直接 exit 100）
      - name: Linux 系统依赖（webkit2gtk 等）
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libxdo-dev libssl-dev patchelf file

      - name: 准备前端资源
        run: node scripts/sync-ui.mjs ${{ matrix.app }}

      - name: 下载 EasyTier sidecar（教师端内置组网）
        if: matrix.app == 'teacher'
        shell: bash
        run: node scripts/fetch-easytier.mjs ${{ matrix.target }}

      - name: 安装客户端依赖
        working-directory: apps/${{ matrix.app }}
        run: npm install

      - name: 构建（tauri build）
        shell: bash
        working-directory: apps/${{ matrix.app }}
        run: |
          set -o pipefail
          npm run build -- --target ${{ matrix.target }} 2>&1 | tee tauri-build.log

      - name: 失败时把编译错误写成注解
        if: failure()
        shell: bash
        working-directory: apps/${{ matrix.app }}
        run: |
          if [ -f tauri-build.log ]; then
            grep -nE '^error(\[|:)|^error: ' tauri-build.log | head -40 | while IFS= read -r l; do echo "::error file=apps/${{ matrix.app }}::$l"; done || true
            echo "==== tauri-build.log 尾部 ===="
            tail -80 tauri-build.log || true
          else
            echo "::error::没有生成 tauri-build.log（失败发生在安装依赖阶段）"
          fi

      - name: 上传安装包
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.app }}-${{ matrix.os }}
          path: apps/${{ matrix.app }}/src-tauri/target/${{ matrix.target }}/release/bundle/**
          if-no-files-found: warn

  android:
    needs: prepare-ui
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.who != 'teacher' || github.event_name == 'push' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: 'aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android'
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'apps/student/src-tauri'

      # GitHub 的 ubuntu 运行器已预装 Android SDK，不需要 android-actions/setup-android
      # （那个 action 仍是 Node 20，在新运行器上被强制跑 Node 24 时会失败）。
      # 注意：sdkmanager 不一定在 PATH 上（实测 exit 127 = command not found），所以要显式定位。
      - name: Android SDK 许可与 NDK
        run: |
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          SDKMGR="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMGR" ]; then SDKMGR="$(command -v sdkmanager || true)"; fi
          if [ -z "$SDKMGR" ] || [ ! -x "$SDKMGR" ]; then
            echo "::error::找不到 sdkmanager（ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT）"
            ls -la "$ANDROID_SDK_ROOT" 2>/dev/null || true
            ls -la "$ANDROID_SDK_ROOT/cmdline-tools" 2>/dev/null || true
            exit 1
          fi
          echo "使用 sdkmanager: $SDKMGR"
          echo "$(dirname "$SDKMGR")" >> $GITHUB_PATH
          yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
          "$SDKMGR" --install "platform-tools" "ndk;26.1.10909125"
          echo "NDK_HOME=$ANDROID_SDK_ROOT/ndk/26.1.10909125" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/26.1.10909125" >> $GITHUB_ENV

      - name: 准备前端资源
        run: node scripts/sync-ui.mjs student

      - name: 初始化 Android 工程
        working-directory: apps/student
        run: |
          npm install
          npx tauri android init --ci || true

      - name: 放行明文流量（真机连 ws://教师机IP 必需）
        run: node scripts/patch-android-manifest.mjs --app student --require

      - name: 构建 APK
        working-directory: apps/student
        run: |
          set -o pipefail
          npx tauri android build --apk 2>&1 | tee android-build.log

      - name: 失败时把错误写成注解
        if: failure()
        working-directory: apps/student
        run: |
          if [ -f android-build.log ]; then
            # Gradle/cargo 的错误行常常带缩进，所以不锚定行首
            grep -nE "FAILURE:|What went wrong|Caused by:|error(\[|:)|error: |Execution failed|linker|not found|NDK|toolchain" android-build.log \
              | head -30 | while IFS= read -r l; do echo "::error file=apps/student::$l"; done || true
            echo "==== 环境 ===="
            echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT NDK_HOME=$NDK_HOME"
            ls "$ANDROID_SDK_ROOT/ndk" 2>/dev/null || true
            rustup target list --installed 2>/dev/null || true
            echo "==== android-build.log 尾部 ===="
            tail -80 android-build.log || true
          else
            echo "::error::没有生成 android-build.log（失败发生在更早的步骤）"
          fi

      - uses: actions/upload-artifact@v7
        if: success()
        with:
          name: android-apk
          path: apps/student/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: warn

  # ------------------------------------------------------------------
  # Draft Release：**统一在这里创建一次**。
  # 早先每个矩阵作业各自调 softprops/action-gh-release，几个作业并发创建同一个
  # Draft Release，被 GitHub 以 "secondary rate limit" 拒掉（Linux 教师端就是这么挂的）。
  # ------------------------------------------------------------------
  release:
    needs: [desktop, android]
    if: ${{ always() && startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    steps:
      - name: 汇总各平台安装包
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: 列出产物（便于排查）
        run: ls -R dist | head -50

      - name: 清理同名旧 Draft（避免资产冲突）
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release delete "${{ github.ref_name }}" --yes --cleanup-tag=false || true

      - name: 创建 Draft Release
        # 安装包已由各矩阵作业上传为 artifact（运行页面可直接下载）；
        # Release 只是打包展示，出问题不该把整条流水线判红。
        continue-on-error: true
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: '课堂积分 ${{ github.ref_name }}'
          draft: true
          files: dist/**

  # ------------------------------------------------------------------
  # iOS：v4 只做"预留"。真正出包需要 macOS 运行器 + Apple 开发者证书/描述文件，
  # 因此这里只做编译期检查（不签名），失败不阻断发布；配好证书后把 build 命令换成
  # `tauri ios build` 并去掉 continue-on-error 即可。
  # ------------------------------------------------------------------
  ios:
    needs: prepare-ui
    continue-on-error: true
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: 'aarch64-apple-ios'
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'apps/student/src-tauri'
      - name: 准备前端资源
        run: node scripts/sync-ui.mjs student
      - name: 初始化 iOS 工程
        working-directory: apps/student
        run: |
          npm install
          npx tauri ios init --ci || true
      - name: 编译检查（不做签名）
        working-directory: apps/student
        run: npx tauri ios build --debug --no-sign 2>&1 | tail -40 || echo "iOS 需要签名证书，跳过（见 docs/11 §7）"
