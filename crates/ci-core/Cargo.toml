[package]
name = "ci-core"
description = "对客户端的门面：枢纽 + 存储 + 领域规则 + EasyTier 组网"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true

[dependencies]
ci-protocol = { path = "../ci-protocol" }
ci-domain = { path = "../ci-domain" }
ci-store = { path = "../ci-store" }
ci-hub = { path = "../ci-hub" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
# 独立枢纽服务器（server.rs）直接用 axum 组织路由
axum = { workspace = true }

# 独立枢纽：等价于 Node 版的 sync-server.js（P2 用它来跑两条端到端测试）
[[bin]]
name = "ci-hub-server"
path = "src/bin/ci-hub-server.rs"
