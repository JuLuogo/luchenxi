[package]
name = "ci-core"
description = "对客户端的门面：枢纽 + 存储 + 领域规则 + EasyTier 组网"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true

[dependencies]
ci-protocol = { path = "../ci-protocol" }
ci-domain = { path = "../ci-domain" }
ci-store = { path = "../ci-store" }
ci-hub = { path = "../ci-hub" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
# 独立枢纽服务器（server.rs）直接用 axum 组织路由
axum = { workspace = true }

# 独立枢纽：等价于 Node 版的 sync-server.js（P2 用它来跑两条端到端测试）
[[bin]]
name = "ci-hub-server"
path = "src/bin/ci-hub-server.rs"

# 前端类型绑定生成器（specta → web/src/bindings/generated.ts）
# required-features：默认构建（不含 bindings）时不编译它，
# 这样 ci-domain 依旧是"默认零 specta 依赖"的纯逻辑 crate
[[bin]]
name = "export-bindings"
path = "src/bin/export-bindings.rs"
required-features = ["bindings"]

[features]
# 生成绑定时打开：让 ci-domain 的 specta 派生生效，并带上 specta 本体
bindings = ["ci-domain/bindings", "dep:specta", "dep:specta-typescript", "dep:specta-serde"]

# 生成器 bin 需要 specta 本体（普通依赖即可，不影响默认构建）
[dependencies.specta]
workspace = true
optional = true

[dependencies.specta-typescript]
workspace = true
optional = true

[dependencies.specta-serde]
workspace = true
optional = true
