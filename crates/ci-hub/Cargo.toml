[package]
name = "ci-hub"
description = "内置枢纽：房间状态机 / WebSocket 广播 / HTTP API（协议同 v3 的 sync-server.js）"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true

[dependencies]
ci-protocol = { path = "../ci-protocol" }
ci-store = { path = "../ci-store" }
# 网页版要判分/算分/点名，只能经枢纽调用 Rust 核心（展示层不得含业务判断）
ci-domain = { path = "../ci-domain" }
axum = { workspace = true }
tokio = { workspace = true }
tower-http = { workspace = true }
futures-util = { workspace = true }
if-addrs = { workspace = true }
qrcode = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
tokio-tungstenite = { workspace = true }
# 领域端点用真 HTTP 打（起一个枢纽再请求），比只测函数更接近前端实际用法
reqwest = { version = "0.12", features = ["json"] }
